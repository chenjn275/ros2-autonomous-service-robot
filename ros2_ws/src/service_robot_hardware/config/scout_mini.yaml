base:
  model: scout_mini
  ros_package: scout_base
  can_interface: can0
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  base_frame: base_footprint
  odom_frame: odom
  publish_tf: true
can:
  bitrate: 500000
  setup:
    - sudo ip link set can0 down
    - sudo ip link set can0 type can bitrate 500000
    - sudo ip link set can0 up
